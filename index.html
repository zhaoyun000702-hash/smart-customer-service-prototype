docs:[{id:'d1',kb:'it',name:'VPN 使用与常见故障处理指南.pdf',type:'PDF',source:'本地上传',owner:'赵艺',folder:'操作与排障',date:'2026-10-01 10:30',parse:'解析完成',proof:'待校对',status:'未发布',scope:'全体员工',expiry:'2027-09-30',version:'V1.0',size:'1.8 MB',text:'VPN 使用与常见故障处理指南\n\n一、适用范围\n适用于已开通远程办公权限的企业员工，使用企业统一发布的 VPN 客户端。\n\n二、连接前检查\n确认本地网络可以正常访问互联网，并使用企业统一身份账号登录。\n\n三、证书过期处理\n出现证书过期提示时，先核对系统日期和时间。时间正确但问题仍存在时，联系 IT 服务台核验证书状态并按授权流程处理。不得关闭证书校验或安装来源不明的证书。\n\n四、问题确认\n处理后重新连接 VPN 并验证是否可以访问内部系统；如仍然失败，提供报错信息及已尝试操作。',chunks:['适用于已开通远程办公权限的企业员工，使用企业统一发布的 VPN 客户端。','出现证书过期提示时，先核对系统日期和时间。时间正确但问题仍存在时，联系 IT 服务台核验证书状态并按授权流程处理。不得关闭证书校验或安装来源不明的证书。','处理后重新连接 VPN 并验证是否可以访问内部系统；如仍然失败，提供报错信息及已尝试操作。'],elements:[['适用对象','已开通远程办公权限的企业员工'],['前置条件','企业统一发布的 VPN 客户端；本地网络正常'],['注意事项','不得关闭证书校验或安装来源不明的证书']],table:[['报错现象','处理方式'],['证书过期','核对系统时间，联系 IT 核验证书'],['网络超时','检查本地网络并记录客户端报错']]},

function save(){try{localStorage.setItem('service-prototype-v5',JSON.stringify(S))}catch(e){toast('浏览器存储空间不足，当前操作暂保留在本次页面中。')}}
function log(t){S.logs.unshift({text:t,date:now()});save()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3200)}
function modal(title,body,footer='',wide=false){const d=$('#dialog');sourceFocus=document.activeElement;d.className=wide?'wide':'';d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="dialog-close" data-act="close" aria-label="关闭">${icon('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-footer">${footer||btn('关闭','close')}</div>`;if(!d.open)d.showModal()}
function closeModal(){const d=$('#dialog');d.close();if(sourceFocus?.isConnected)sourceFocus.focus()}
function formData(){const f=$('#modal-form');if(f&&!f.reportValidity())return null;return Object.fromEntries(new FormData(f))}
function input(name,label,value='',type='text',required=false,full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}" class="${required?'required':''}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`}
function area(name,label,value='',required=false,full=true){return `<div class="field ${full?'full':''}"><label for="f-${name}" class="${required?'required':''}">${label}</label><textarea id="f-${name}" name="${name}" ${required?'required':''}>${esc(value)}</textarea></div>`}
function select(name,label,options,value='',full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><div class="stat-label">${x[0]}</div><div class="stat-value num">${x[1]}</div><div class="stat-sub">${x[2]||''}</div></div>`).join('')}</div>`}
function pageHead(title,sub='',actions='',crumb=''){return `<div class="page-head"><div>${crumb?`<div class="bread">${crumb}</div>`:''}<h1>${title}</h1>${sub?`<p class="subtext">${sub}</p>`:''}</div><div class="head-actions">${actions}</div></div>`}
function searchBar(placeholder='搜索名称',key='query'){return `<label class="search">${icon('search')}<input aria-label="${placeholder}" data-filter="${key}" value="${esc(U[key]||'')}" placeholder="${placeholder}"></label>`}
function table(headers,rows,foot=''){return `<div class="panel"><div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}">${empty('暂无符合条件的记录')}</td></tr>`}</tbody></table></div><div class="table-foot"><span>${foot||'共 '+rows.length+' 条记录'}</span><span>1 / 1</span></div></div>`}
function empty(t='暂无记录'){return `<div class="empty">${icon('inbox')}<p>${t}</p></div>`}
function fileName(d,act='edit-doc'){return `<div class="file-name"><div class="file-mark">${icon('file')}</div><div>${link(esc(d.name),act,d.id)}<div class="file-meta">${esc(d.type)} · ${esc(d.size||'')} · ${esc(d.version||'')}</div></div></div>`}
function download(name,content,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvExport(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function go(view,id){U.view=view;U.query='';U.status='all';if(id){if(view==='editor')U.editor=id;if(view==='case')U.case=id;if(view==='review')U.review=id}const mods={knowledge:['kbs','docs','editor','qa','cases','case','feedback'],employee:['employeehome','employeechat','employeehistory','employeetickets'],support:['support','supporttickets','submitted'],quality:['rules','inspections','review','rectifications','reports']};for(const [m,vs]of Object.entries(mods))if(vs.includes(view))U.module=m;render();$('#main').scrollTop=0}
function header(){const mods=[['knowledge','5.1','智能文档处理平台'],['employee','5.2','员工自助 Agent'],['support','5.3','客服 AI Copilot'],['quality','5.4','AI 质检']];const names={knowledge:['赵','知识运营 · 赵艺'],employee:['张','张晨 · 产品设计部'],support:['陈','客服 · 陈宁'],quality:['林','质检 · 林悦']};const n=names[U.module];$('#header').innerHTML=`<div class="brand"><div class="brand-mark">${icon('chat')}</div><span>智能客服平台</span></div><nav class="module-tabs" aria-label="模块导航">${mods.map(m=>`<button class="module-tab ${U.module===m[0]?'active':''}" data-act="module" data-id="${m[0]}"><small>${m[1]}</small>${m[2]}</button>`).join('')}</nav><div class="identity"><div class="avatar">${n[0]}</div><span>${n[1]}</span></div>`}
function sidebar(){const menus={knowledge:[['kbs','知识库管理','book'],['docs','企业文档','file'],['qa','标准 QA','chat'],['cases','工单知识审核','inbox',S.cases.filter(c=>c.status==='待审核').length],['feedback','知识反馈','flag',S.feedback.filter(c=>c.status!=='已处理').length]],employee:[['employeehome','服务首页','home'],['employeechat','当前会话','chat'],['employeetickets','我的工单','ticket'],['employeehistory','历史会话','clock']],support:[['support','服务接待','chat'],['supporttickets','工单管理','ticket'],['submitted','知识提交记录','book']],quality:[['inspections','质检任务与结果','shield'],['rules','质检规则','settings'],['rectifications','问题整改','flag'],['reports','统计与报告','chart']]};const active=U.view==='editor'?'docs':U.view==='case'?'cases':U.view==='review'?'inspections':U.view;$('#sidebar').innerHTML=`<div class="nav-caption">${{knowledge:'知识运营工作台',employee:'员工服务中心',support:'客服工作台',quality:'质检工作台'}[U.module]}</div>${menus[U.module].map(n=>`<button class="nav-item ${active===n[0]?'active':''}" data-act="nav" data-id="${n[0]}">${icon(n[2])}<span>${n[1]}</span>${n[3]?`<span class="count">${n[3]}</span>`:''}</button>`).join('')}<div class="sidebar-bottom"><div class="sidebar-note">${U.module==='employee'?`${link('切换登录状态','login-state')}<br>`:''}智能客服平台<br>V1.0.0 · 产品原型</div></div>`}
function render(){header();sidebar();const views={kbs:renderKBs,docs:renderDocs,editor:renderEditor,qa:renderQA,cases:renderCases,case:renderCase,feedback:renderFeedback,employeehome:renderEmployeeHome,employeechat:renderEmployeeChat,employeetickets:renderEmployeeTickets,employeehistory:renderHistory,support:renderSupport,supporttickets:renderSupportTickets,submitted:renderSubmitted,rules:renderRules,inspections:renderInspections,review:renderReview,rectifications:renderRectifications,reports:renderReports};$('#main').innerHTML=(U.module==='employee'&&!S.loggedIn)?renderLogin():views[U.view]();enhanceRenderedView();if(U.view==='employeechat'||U.view==='support'){const m=$('.messages');if(m)m.scrollTop=m.scrollHeight}if(U.view==='editor')bindEditor();}
function enhanceRenderedView(){if(U.view==='editor'&&U.step===2){const body=$('.panel-body');if(body)body.insertAdjacentHTML('beforeend',`<div class="note spaced"><b>多模态附件关联</b><div class="row wrap" style="margin-top:9px">${tag('图片 2 张','blue')}${tag('表格 1 个','green')}${tag('公式 0 个')}</div><p class="small muted" style="margin-top:8px">图片、表格和公式分别保留附件标识与正文锚点；命中知识块后按需加载。</p></div>`)}if(U.view==='editor'&&U.step===3){const main=$('#main');main.innerHTML=main.innerHTML.replaceAll('入库检查','发布检查').replaceAll('提交入库','确认发布').replace('文档提交后进入待审核状态。审核通过并完成索引构建后供正式服务使用。','确认发布后构建检索索引，当前版本即可供授权用户使用。').replaceAll('提交审核','确认发布').replaceAll('审核通过并发布','确认发布')}if(U.view==='support'){const tab=$$('.assist-tabs button').find(x=>x.textContent.trim()==='AI 助手');if(tab)tab.textContent='AI Copilot'}if(U.view==='kbs'){const stat=$$('.stat').find(x=>x.textContent.includes('覆盖人事、财务、IT、行政'));if(stat)stat.innerHTML=stat.innerHTML.replace('覆盖人事、财务、IT、行政','覆盖六类员工服务')}}
function filtered(arr,searchFields){return arr.filter(x=>(U.kb==='all'||x.kb===U.kb)&&(!U.query||searchFields.some(k=>String(x[k]||'').toLowerCase().includes(U.query.toLowerCase())))&&(U.status==='all'||x.status===U.status))}
function kbSelect(){return `<select aria-label="选择知识库" data-filter="kb"><option value="all">全部知识库</option>${S.kbs.map(k=>`<option value="${k.id}" ${U.kb===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select>`}
function statusSelect(items){return `<select aria-label="状态筛选" data-filter="status"><option value="all">全部状态</option>${items.map(t=>`<option ${U.status===t?'selected':''}>${t}</option>`).join('')}</select>`}
function renderKBs(){const rows=S.kbs.filter(k=>!U.query||[k.name,k.category,k.owner].join().includes(U.query));return pageHead('知识库管理','按业务领域统一管理企业知识与使用权限',btn(icon('plus')+'新建知识库','kb-new','','primary'),'知识运营 / 知识库管理')+stats([['知识库',S.kbs.length,'覆盖人事、财务、IT、行政'],['企业文档',S.docs.length,'统一解析与人工校对'],['标准 QA',S.qas.filter(q=>q.status==='已发布').length,'已发布的问答对'],['待审核案例',S.cases.filter(c=>c.status==='待审核').length,'来自客服工作台']])+`<div class="toolbar">${searchBar('搜索知识库、分类或负责人')}<span class="spacer"></span><span class="muted small">当前展示授权知识库</span></div><div class="grid three">${rows.map(k=>{const ds=S.docs.filter(d=>d.kb===k.id),qs=S.qas.filter(q=>q.kb===k.id);return `<article class="kb-card"><div class="row between"><div class="kb-title"><div class="kb-icon">${icon('book')}</div><div><h2>${esc(k.name)}</h2><span class="small muted">${esc(k.category)} · ${esc(k.owner)}</span></div></div>${link(icon('settings'),'kb-edit',k.id)}</div><p class="kb-desc">${esc(k.desc)}</p><div class="kb-numbers"><div><b>${ds.length}</b>企业文档</div><div><b>${qs.length}</b>标准 QA</div><div><b>${ds.filter(d=>d.status==='已发布').length+qs.filter(q=>q.status==='已发布').length}</b>已发布知识</div></div><div class="row small muted">${icon('user')} ${esc(k.scope)}</div><div class="kb-footer">${link('权限设置','kb-permissions',k.id)}${btn('进入知识库','kb-open',k.id,'small soft')}</div></article>`}).join('')||empty('未找到知识库')}</div>`}
function renderDocs(){const ds=filtered(S.docs,['name','owner','folder','source']);return pageHead('企业文档','统一完成资料接入、解析校对、知识加工和发布',btn(icon('refresh')+'同步资料','sync-docs')+btn(icon('upload')+'上传文档','upload-doc','','primary'),'知识运营 / 企业文档')+`<div class="toolbar">${searchBar('搜索文档、目录、来源或负责人')}${kbSelect()}${statusSelect(['未发布','已发布','已停用','已过期'])}<span class="spacer"></span>${link('操作记录','logs')}</div>`+table(['文档名称','所属知识库 / 目录','解析状态','校对状态','发布状态','更新时间','操作'],ds.map(d=>`<tr><td class="title-cell">${fileName(d)}</td><td>${esc(S.kbs.find(k=>k.id===d.kb)?.name||'')}<div class="file-meta">${esc(d.folder)}</div></td><td>${tag(d.parse)}</td><td>${tag(d.proof)}</td><td>${tag(d.status)}</td><td class="small muted">${esc(d.date)}<br>${esc(d.owner)}</td><td><div class="actions">${link('处理','edit-doc',d.id)}${link('更多','doc-more',d.id)}</div></td></tr>`))}
function renderQA(){const qs=filtered(S.qas,['q','owner','category','theme']);return pageHead('标准 QA','维护标准问题、相似问和对应答案',btn(icon('upload')+'批量导入','qa-import')+btn('文档提取 QA','qa-extract')+btn(icon('plus')+'新建 QA','qa-new','','primary'),'知识运营 / 标准 QA')+`<div class="toolbar">${searchBar('搜索问题、发布人或业务类型')}${kbSelect()}${statusSelect(['草稿','已发布','已停用'])}<span class="spacer"></span>${link('下载导入模板','qa-template')}</div>`+table(['标准问题 Q','分类 / 主题','来源依据','适用范围','发布状态','发布人 / 时间','操作'],qs.map(q=>`<tr><td class="title-cell">${link(esc(q.q),'qa-edit',q.id)}<div class="file-meta">${q.similar?esc(q.similar.split(/[；;\n]/).filter(Boolean).length)+' 个相似问':'暂无相似问'}</div></td><td>${esc(q.category)}<div class="file-meta">${esc(q.theme)}</div></td><td style="max-width:180px">${esc(q.source)}</td><td>${esc(q.scope)}</td><td>${tag(q.status)}</td><td>${esc(q.owner)}<div class="file-meta">${esc(q.date)}</div></td><td>${link('编辑','qa-edit',q.id)} ${link(q.status==='已发布'?'停用':'发布','qa-toggle',q.id)}</td></tr>`))}
function paper(d){return `<div class="doc-paper">${d.preview&&/image/.test(d.mime||'')?`<img class="doc-original-image" src="${esc(d.preview)}" alt="上传的原文件">`:d.preview&&d.type==='PDF'?`<object data="${esc(d.preview)}" type="application/pdf" width="100%" height="560"><p>浏览器不支持直接预览，可下载原文件查看。</p></object>`:`<div class="small muted" style="text-align:center;letter-spacing:3px">企业内部文件</div><h2>${esc(d.name.replace(/\.[^.]+$/,''))}</h2>${d.text.split(/\n\n/).slice(1).map((p,i)=>`<p class="${i===1?'highlight':''}" data-source="${i}">${esc(p).replace(/\n/g,'<br>')}</p>`).join('')||`<p>${esc(d.text)}</p>`}${d.table?.length?`<table>${d.table.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${esc(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table>`:''}<p class="small muted" style="text-align:center;margin-top:40px">内部资料 · 第 1 页</p>`}</div>`}
function renderEditor(){const d=S.docs.find(x=>x.id===U.editor)||S.docs[0];U.editor=d.id;let body='';if(U.step===0)body=`<div class="editor-layout"><section class="panel"><div class="panel-head"><h3>原文件</h3><span class="zoom-indicator">第 1 页 / 共 1 页</span></div><div class="editor-controls">${btn(icon('image')+'框选识别','ocr-crop','','small')}${btn('表格修正','edit-table',d.id,'small')}${btn(U.links?'取消联动':'开启联动','toggle-scroll','','small')} ${link('预览 / 下载','preview-doc',d.id)}</div><div class="doc-pane" id="original-pane">${paper(d)}</div></section><section class="panel"><div class="panel-head"><h3>解析结果与校对</h3>${tag(d.proof)}</div><div class="editor-controls">${btn('重新识别','ocr-rerun',d.id,'small')}${btn('要素高亮','toggle-highlight','','small')}<span class="small muted">点击正文即可编辑</span></div><div class="doc-pane" id="parsed-pane" style="padding:0;background:white"><div class="editor-text" contenteditable="true" role="textbox" aria-label="解析结果编辑" id="parsed-text">${esc(d.text)}</div></div></section></div>`;if(U.step===1)body=`<div class="grid two"><section class="panel"><div class="panel-head"><h3>知识切片 <span class="muted small">${d.chunks.length} 段</span></h3>${btn(icon('spark')+'自动切片','auto-chunk',d.id,'small soft')}</div><div class="panel-body">${d.chunks.map((c,i)=>`<div class="chunk"><div class="chunk-top"><span>片段 ${String(i+1).padStart(2,'0')} · ${c.length} 字 · 原文第 1 页</span><div>${link('定位','chunk-source',String(i))}${link('拆分','split-chunk',String(i))}${i<d.chunks.length-1?link('合并下段','merge-chunk',String(i)):''}${link('删除','delete-chunk',String(i),'danger')}</div></div><textarea aria-label="知识片段 ${i+1}" data-chunk="${i}">${esc(c)}</textarea></div>`).join('')||empty('先完成原文校对，再生成知识切片')}${btn(icon('plus')+'添加切片','add-chunk','','small')}</div></section><section class="panel"><div class="panel-head"><h3>来源原文</h3>${tag('保留原文关联','blue')}</div><div class="doc-pane">${paper(d)}</div></section></div>`;if(U.step===2)body=`<section class="panel"><div class="panel-head"><h3>要素抽取校对</h3>${btn(icon('spark')+'重新抽取','extract-elements',d.id,'small soft')}</div><div class="panel-body"><p class="muted small" style="margin-bottom:18px">核对要素名称、内容和原文依据。未提供的信息保留为空。</p>${d.elements.map((v,i)=>`<div class="form-grid" style="grid-template-columns:180px 1fr auto;margin-bottom:14px"><div class="field"><label>要素名称</label><input aria-label="要素名称 ${i+1}" data-element="${i}:0" value="${esc(v[0])}"></div><div class="field"><label>要素内容</label><input aria-label="要素内容 ${i+1}" data-element="${i}:1" value="${esc(v[1])}"></div><div style="align-self:end">${link('原文','element-source',String(i))}${link('删除','delete-element',String(i),'danger')}</div></div>`).join('')}${btn(icon('plus')+'添加要素','add-element','','small')}</div></section>`;if(U.step===3)body=`<div class="review-layout"><section class="panel"><div class="panel-head"><h3>入库检查</h3>${tag(d.status)}</div><div class="panel-body">${[['原文校对已确认',d.proof==='校对完成'],['已生成非空知识切片',d.chunks.length>0&&d.chunks.every(c=>c.trim())],['资料来源已保留',!!d.source],['使用范围与有效期已配置',!!d.scope&&!!d.expiry]].map(([t,ok])=>`<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--line)"><span>${t}</span>${tag(ok?'已完成':'待完成',ok?'green':'orange')}</div>`).join('')}<div class="note spaced">文档提交后进入待审核状态。审核通过并完成索引构建后供正式服务使用。</div></div></section><section class="panel"><div class="panel-head"><h3>资料属性</h3>${link('编辑','doc-props',d.id)}</div><div class="panel-body"><dl class="kv"><dt>所属知识库</dt><dd>${esc(S.kbs.find(k=>k.id===d.kb)?.name)}</dd><dt>业务负责人</dt><dd>${esc(d.owner)}</dd><dt>使用范围</dt><dd>${esc(d.scope)}</dd><dt>有效期至</dt><dd>${esc(d.expiry)}</dd><dt>来源</dt><dd>${esc(d.source)}</dd><dt>版本</dt><dd>${esc(d.version)}</dd></dl>${d.status==='待审核'?btn('审核通过并发布','doc-publish',d.id,'primary'):d.status==='已发布'?tag('当前版本已生效'):''}</div></section></div>`;return pageHead(esc(d.name),'企业文档智能处理',btn('返回列表','nav','docs'),`企业文档 / ${esc(d.folder)}`)+`<div class="steps">${['原文校对','知识切片','要素校对','提交入库'].map((t,i)=>`<button class="step ${U.step===i?'active':U.step>i?'done':''}" data-act="editor-step" data-id="${i}"><span class="step-num">${i+1}</span>${t}</button>`).join('')}</div>${d.uploaded&&d.type!=='TXT'&&d.type!=='MD'?'<div class="note warn" style="margin-bottom:14px">此文件可预览原文；OCR 与要素抽取为交互演示，请手动输入校对内容。</div>':''}${body}<div class="fixed-actions"><div class="actions">${btn('暂存进度','save-doc',d.id)}<span class="small muted">${d.saved?'已保存于 '+esc(d.saved):'支持暂存后继续处理'}</span></div><div>${U.step>0?btn('上一步','editor-step',String(U.step-1)):''} ${U.step<3?btn(U.step===0?'确认校对并继续':'保存并继续','editor-next',d.id,'primary'):btn(d.status==='待审核'?'已提交审核':'提交审核','submit-doc',d.id,'primary')}</div></div>`}
function bindEditor(){if(U.links){const a=$('#original-pane'),b=$('#parsed-pane');if(a&&b){let lock=false;for(const [x,y]of [[a,b],[b,a]])x.addEventListener('scroll',()=>{if(lock)return;lock=true;y.scrollTop=x.scrollTop/Math.max(1,x.scrollHeight-x.clientHeight)*Math.max(0,y.scrollHeight-y.clientHeight);requestAnimationFrame(()=>lock=false)})}}}
function captureEditor(){const d=S.docs.find(x=>x.id===U.editor);if(!d)return;const t=$('#parsed-text');if(t&&d.text!==t.innerText){d.text=t.innerText;d.proof='待校对';d.chunks=[];d.elements=[];if(d.status==='已发布'){d.previousPublished=d.version;d.status='未发布';toast('已保存为修订内容，原已发布版本继续服务。')}}$$('[data-chunk]').forEach(x=>d.chunks[+x.dataset.chunk]=x.value);$$('[data-element]').forEach(x=>{const [i,j]=x.dataset.element.split(':');d.elements[i][j]=x.value});save()}
function renderCases(){const cs=S.cases.filter(c=>(!U.query||[c.title,c.ticket,c.submitter].join().includes(U.query))&&(U.status==='all'||c.status===U.status));return pageHead('工单知识审核','审核客服提交的案例，沉淀为可复用的标准 QA','', '知识运营 / 工单知识审核')+`<div class="toolbar">${searchBar('搜索案例、工单号或提交人')}${statusSelect(['待审核','已发布','已退回','不采纳'])}</div>`+table(['案例名称 / 原工单','业务分类','提交客服','提交时间','审核状态','操作'],cs.map(c=>`<tr><td class="title-cell">${link(esc(c.title),'open-case',c.id)}<div class="file-meta">${esc(c.ticket)}</div></td><td>${esc(c.category)}</td><td>${esc(c.submitter)}</td><td>${esc(c.date)}</td><td>${tag(c.status)}</td><td>${link(c.status==='待审核'?'查看并审核':'查看详情','open-case',c.id)}</td></tr>`))}
function renderCase(){const c=S.cases.find(c=>c.id===U.case);return pageHead(esc(c.title),`来源工单 ${esc(c.ticket)} · 提交人 ${esc(c.submitter)}`,btn('返回列表','nav','cases'),'工单知识审核 / 案例详情')+`<div class="review-layout"><section class="panel"><div class="panel-head"><h3>原工单与处理依据</h3>${tag('受控查看','blue')}</div><div class="panel-body"><dl class="kv">${[['问题现象',c.symptom],['环境',c.environment],['已确认原因',c.cause],['处理措施',c.action],['处理结果',c.result],['适用条件',c.conditions]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="divider"></div><h3>关联会话</h3><div class="evidence" style="white-space:pre-wrap">${esc(c.evidence)}</div></div></section><section class="panel"><div class="panel-head"><h3>QA 内容修订</h3>${tag(c.status)}</div><div class="panel-body"><form id="case-form"><div class="form-grid">${area('cq','标准问题 Q',c.q,true)}${area('ca','标准答案 A',c.a,true)}${select('caseChoice','处理方式',[['new','新增标准 QA'],...S.qas.filter(q=>q.category===c.category).map(q=>[q.id,'更新：'+q.q])],'new',true)}${area('comment','审核意见',c.comment||'')}</div><div class="note spaced">核对敏感信息、适用条件和事实依据。原因不明确或方案仅适用于个人时，退回补充。</div><label class="check-line spaced"><input type="checkbox" name="checked" required>已核对原工单，完成脱敏与适用条件确认</label></form><div class="row wrap spaced">${btn('检查已有知识','case-duplicate',c.id)}${btn('暂存修订','case-save',c.id)}${c.status==='待审核'?btn('通过并发布','case-approve',c.id,'primary'):''}</div>${c.status==='待审核'?`<div class="row spaced">${link('退回补充','case-return',c.id)}${link('不采纳','case-reject',c.id,'danger')}</div>`:''}</div></section></div>`}

function renderEmployeeHome(){return `<div class="home-main"><div class="welcome"><div class="welcome-icon">${icon('spark')}</div><div><h1>张晨，你好</h1><p>有什么工作上的问题需要帮忙？</p></div></div><div class="hero-input"><textarea id="home-query" aria-label="咨询问题" placeholder="问制度、查进度、办业务，或描述遇到的故障…"></textarea><div class="row between"><span class="small muted">已关联企业身份 · 仅查询本人授权信息</span>${btn(icon('send')+'发送','home-send','','primary')}</div></div><div class="section-title"><h2>常用服务</h2><span class="muted small">人事 · 财务 · IT · 行政</span></div><div class="grid four">${[['制度问答','制度、流程与操作指引','book','公司的请假申请流程是什么？'],['业务查询','个人信息与办理进度','search','查询我的报销进度'],['事务办理','填写信息并确认提交','ticket','我要申领一台显示器'],['IT 故障求助','账号、权限与办公网络','monitor','VPN 连接不上，提示证书过期']].map(([a,b,c,d])=>`<button class="quick-card" data-act="quick-ask" data-id="${d}"><div class="quick-icon">${icon(c)}</div><div><h3>${a}</h3><p>${b}</p></div></button>`).join('')}</div><div class="grid two" style="margin-top:24px"><section class="panel"><div class="panel-head"><h3>大家常问</h3>${icon('chat')}</div><div class="panel-body" style="padding-top:5px;padding-bottom:5px">${['在哪里查看我的假期余额？','报销单退回后需要怎么处理？','如何申请办公显示器？'].map(q=>`<button class="ask-line" data-act="quick-ask" data-id="${q}"><span>${q}</span>${icon('chevron')}</button>`).join('')}</div></section><section class="panel" style="margin:0"><div class="panel-head"><h3>我的服务工单</h3>${link('查看全部','nav','employeetickets')}</div><div class="panel-body"><div class="row between"><span>VPN 连接异常</span>${tag(S.threads[0].status)}</div><div class="file-meta">IT-20261001-001 · IT 服务组</div><div class="row" style="margin-top:16px">${btn('查看处理进度','employee-ticket',S.threads[0].id,'small')}</div></div></section></div><div class="row between" style="margin-top:25px;color:#8d9ab0;font-size:12px"><span>回答可查看依据，业务办理遵循原审批流程。</span>${link('联系人工客服','employee-transfer')}</div></div>`}
function renderMessage(m,employee=false,i=0){if(employee&&m.role==='internal')return '';if(m.role==='system')return `<div class="msg system">${esc(m.text)}</div>`;const isUser=m.role==='user';return `<div class="msg ${isUser?'user':''} ${m.role==='internal'?'internal':''}"><div class="avatar ${isUser?'green':''}">${isUser?'张':m.role==='agent'?'陈':m.role==='internal'?'备':'AI'}</div><div class="msg-content"><div class="msg-name">${isUser?'员工':m.role==='agent'?'客服':m.role==='internal'?'内部备注 · 员工不可见':'智能客服'}</div>${m.text?`<div class="bubble">${esc(m.text)}</div>`:''}${m.image?`<img class="shot-preview" src="${esc(m.image)}" alt="员工上传的报错截图">`:''}${m.card?messageCard(m.card):''}${m.source?`<button class="citation" data-act="source" data-id="${esc(m.source)}">${icon('link')} 查看知识依据</button>`:''}${employee&&m.role==='assistant'?`<div class="feedback-line">${link(m.feedback==='有帮助'?'已标记有帮助':'有帮助','answer-feedback',i+':有帮助')}${link(m.feedback==='无帮助'?'已提交反馈':'无帮助','answer-feedback',i+':无帮助')}</div>`:''}</div></div>`}
function messageCard(c){if(c.type==='balance')return `<div class="msg-card"><div class="row between"><h3>我的假期余额</h3>${tag('本人数据','blue')}</div><dl class="kv"><dt>年假</dt><dd><strong style="font-size:21px;color:var(--blue)">5</strong> 天</dd><dt>调休</dt><dd>8 小时</dd><dt>有效期</dt><dd>以人事系统返回的各假种规则为准</dd><dt>来源 / 时间</dt><dd>人力资源系统 · ${esc(c.time||now())}</dd></dl>${btn('刷新结果','refresh-query','balance','small')}${btn('申请休假','apply-form','请假申请','small soft')}</div>`;if(c.type==='expenses')return `<div class="msg-card"><h3>我的报销单</h3>${S.applications.filter(a=>a.type==='差旅报销').map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row between">${link(esc(a.title),'application-detail',a.id)}${tag(a.status)}</div><div class="small muted">${a.id} · ${a.amount} · ${a.date}</div></div>`).join('')}<p class="file-meta" style="margin-top:10px">财务报销系统 · 查询于 ${esc(c.time||now())}</p>${btn('刷新结果','refresh-query','expenses','small')}</div>`;if(c.type==='apply')return `<div class="msg-card"><h3>${esc(c.name)}</h3><p class="muted small">补充办理信息，确认后再提交申请。</p>${btn('填写申请信息','apply-form',c.name,'primary small')}</div>`;if(c.type==='application'){const a=S.applications.find(x=>x.id===c.id);return `<div class="msg-card"><div class="row between"><h3>${esc(a?.type||'业务申请')}</h3>${tag(a?.status||'已提交')}</div><dl class="kv"><dt>申请编号</dt><dd>${esc(c.id)}</dd><dt>当前节点</dt><dd>${esc(a?.node||'等待审批')}</dd><dt>后续处理</dt><dd>按业务系统审批流程处理</dd></dl>${btn('查看进度','application-detail',c.id,'small')}</div>`}if(c.type==='vpn')return `<div class="msg-card"><h3>请确认以下排查信息</h3><p class="small muted">核对系统日期与时间是否正确，并记录客户端版本。不要关闭证书校验。</p><div class="row wrap">${btn('时间正常，仍无法连接','vpn-followup','','small soft')}${btn('已经恢复','employee-resolved','','small')}</div></div>`;if(c.type==='transfer')return `<div class="msg-card"><div class="row between"><h3>已转入人工服务</h3>${tag('待接入')}</div><p class="small muted">工单 ${esc(c.ticket)} 已保留已有问题信息与排查记录。</p>${btn('查看工单','employee-ticket',c.thread,'small')}${btn( function renderEmployeeChat(){const msgs=S.employeeTransferred?S.threads.find(t=>t.id===S.employeeTransferred)?.messages||S.employeeSession:S.employeeSession;return pageHead('在线咨询','已使用企业身份登录',btn(icon('plus')+'新建会话','new-chat'))+`<div class="chat-layout"><section class="chat-panel"><div class="chat-top"><div class="row"><div class="avatar">AI</div><div><h3>${S.employeeTransferred?'人工服务会话':'员工自助服务'}</h3><span class="file-meta">${S.employeeTransferred?'保留自助与人工处理记录':'咨询、查询、办理与排障'}</span></div></div>${btn('转人工','employee-transfer','','small')}</div><div class="messages">${msgs.length?msgs.map((m,i)=>renderMessage(m,true,i)).join(''):`<div class="msg"><div class="avatar">AI</div><div class="msg-content"><div class="bubble">你好，我可以帮你查找制度、查询业务进度和办理员工事务。请描述你的问题。</div></div></div>`}${U.employeeTyping?'<div class="msg"><div class="avatar">AI</div><div class="bubble">正在整理回复…</div></div>':''}</div><div class="composer"><div class="suggestion-chips">${['查询我的假期余额','查看报销进度','申领办公设备'].map(t=>`<button class="chip" data-act="quick-ask" data-id="${t}">${t}</button>`).join('')}</div>${U.shot?`<div class="row"><img class="shot-preview" src="${esc(U.shot)}" alt="待发送截图">${link('删除截图','remove-shot')}</div>`:''}<textarea id="employee-input" placeholder="请输入问题，Enter 发送，Shift + Enter 换行" aria-label="员工消息"></textarea><div class="compose-tools"><div class="row">${link(icon('image')+' 上传截图','upload-shot')}${link('结束并评价','employee-evaluate')}</div><div class="row">${U.employeeTyping?btn('停止生成','stop-generation','','small'):''}${btn(icon('send')+'发送','employee-send','','primary small')}</div></div></div></section><div class="chat-aside"><section class="panel"><div class="panel-head"><h3>服务信息</h3></div><div class="panel-body"><dl class="kv" style="grid-template-columns:65px 1fr"><dt>员工</dt><dd>张晨</dd><dt>部门</dt><dd>产品设计部</dd><dt>会话状态</dt><dd>${S.employeeTransferred?'人工处理中':'自助服务中'}</dd><dt>解决状态</dt><dd>${S.resolved===true?'已确认解决':S.resolved===false?'尚未解决':'待确认'}</dd></dl></div></section><section cl function renderSupport(){const t=S.threads.find(x=>x.id===U.thread)||S.threads[0];U.thread=t.id;const list=S.threads.filter(x=>(U.queue==='all'||x.status===U.queue)&&(!U.query||[x.employee,x.title,x.ticket].join().includes(U.query)));return pageHead('服务接待','集中处理员工会话与服务工单',`<span class="small muted">接待状态</span><select style="width:100px" aria-label="接待状态" data-change="seat-status">${['在线','忙碌','离线'].map(x=>`<option ${S.seatStatus===x?'selected':''}>${x}</option>`).join('')}</select>`)+`<div class="support-layout"><section class="queue-pane"><div class="queue-title"><div class="row between"><h3>会话列表</h3><span class="tag blue">${S.threads.length}</span></div>${searchBar('搜索员工、问题或工单')}<div class="queue-tabs">${[['all','全部'],['待接入','待接入'],['待跟进','待跟进']].map(([v,n])=>`<button class="${U.queue===v?'active':''}" data-act="queue-filter" data-id="${v}">${n}</button>`).join('')}</div></div>${list.map(x=>`<div class="thread-row ${x.id===t.id?'active':''}" role="button" tabindex="0" data-act="select-thread" data-id="${x.id}"><div class="row between"><b>${esc(x.employee)}</b>${tag(x.status)}</div><h3>${esc(x.title)}</h3><p>${esc(x.ticket)} · ${esc(x.owner)}</p></div>`).join('')||empty('暂无会话')}</section><section class="chat-panel"><div class="chat-top"><div><h3>${esc(t.employee)} <span class="muted small">${esc(t.dept)}</span></h3><span class="file-meta">${esc(t.ticket)}</span></div><div class="actions">${t.status==='待接入'?btn('接入','accept-thread',t.id,'small primary'):''}${btn('转交','transfer-thread',t.id,'small')}</div></div><div class="messages">${t.messages.map(m=>renderMessage(m,false)).join('')}</div><div class="composer"><div class="row between"><div class="row">${link('回复员工','compose-mode','reply')}${link('内部备注','compose-mode','note')}</div><span class="small muted">${U.composeMode==='note'?'仅服务人员可见':'员工可见'}</span></div><textarea id="support-input" aria-label="客服回复" placeholder="${U.composeMode==='note'?'记录内部工作信息，不会发送给员工':'输入回复，或采用右侧 AI 建议'}">${esc(U.drafts[t.id]||'')}</text function renderInspections(){const jobs=S.inspections;const done=jobs.filter(j=>j.processed).length;return pageHead('质检任务与结果','自动检查服务工单，保留规则与原文依据',btn(icon('plus')+'发起质检','inspect-select','','primary'),'AI 质检 / 智能质检')+stats([['应检工单',jobs.length,'当前演示统计范围'],['已完成质检',done,'按工单去重统计'],['质检覆盖率',jobs.length?Math.round(done/jobs.length*100)+'%':'—','已完成质检 / 应检工单'],['待人工复核',jobs.filter(j=>j.status==='待复核').length,'AI 发现的问题尚未最终确认']])+`<div class="toolbar">${searchBar('搜索工单、客服或问题')}${statusSelect(['待质检','待复核','已复核','未发现问题','质检失败'])}</div>`+table(['工单编号 / 主题','客服 / 业务组','质检时间','问题数','状态','操作'],jobs.filter(j=>(U.status==='all'||j.status===U.status)&&(!U.query||[j.ticket,j.agent,j.title].join().includes(U.query))).map(j=>`<tr><td>${link(esc(j.ticket),'open-review',j.id)}<div class="file-meta">${esc(j.title)}</div></td><td>${esc(j.agent)}<div class="file-meta">${esc(j.dept)}</div></td><td>${esc(j.date)}</td><td>${j.processed?j.issues.length:'—'}</td><td>${tag(j.status)}</td><td>${j.processed?link('查看结果','open-review',j.id):link(j.status==='质检失败'?'重试':'执行质检','run-inspection',j.id)}</td></tr>`))}
function renderReview(){const j=S.inspections.find(x=>x.id===U.review);return pageHead('质检详情',`${esc(j.ticket)} · ${esc(j.title)} · 客服 ${esc(j.agent)}`,btn('返回列表','nav','inspections'),'质检任务 / 结果复核')+`<div class="review-layout"><section class="panel"><div class="panel-head"><h3>原始服务记录</h3>${tag('依据')}</div><div class="panel-body"><dl class="kv"><dt>工单主题</dt><dd>${esc(j.title)}</dd><dt>最终方案</dt><dd>${esc(j.solution)}</dd><dt>处理结果</dt><dd>${esc(j.result)}</dd></dl><div class="divider"></div><h3>关联会话</h3><div class="evidence" style="white-space:pre-wrap">${esc(j.transcript)}</div></div></section><section class="panel"><div class="panel-head"><h3>质检结果</h3>${tag(j.status)}</div><div class="panel-body">${!j.processed?`<div class="empty">尚未执行质检<br>${btn('执行质检','run-inspection',j.id,'primary')}</div>`:j.issues.length?j.issues.map(i=>`<div class="review-card"><div class="row between"><h3>${esc(i.type)}</h3>${tag(i.decision)}</div><p style="margin:10px 0">${esc(i.text)}</p><div class="small muted">命中规则：${esc(i.rule)}</div><div class="quote" style="white-space:pre-wrap">${esc(i.evidence)}</div><div class="field spaced"><label for="review-${i.id}">复核意见</label><textarea id="review-${i.id}" placeholder="填写核实依据或调整后的结论">${esc(i.comment)}</textarea></div><div class="row wrap spaced">${btn('确认问题','issue-confirm',i.id,'primary small')}${btn('修改结论','issue-edit',i.id,'small')}${btn('标记误判','issue-dismiss',i.id,'small')}</div>${i.decision==='确认问题'?`<div class="row spaced">${link('发起整改','rectify-new',i.id)}${link('反馈知识问题','qc-feedback',i.id)}</div>`:''}</div>`).join(''):`<div class="note ok">按当前启用规则完成检查，未发现问题。</div>`}<p class="small muted">违规认定及客服考核以人工复核结论为准。</p></div></section></div>`}
function renderRectifications(){return pageHead('问题整改','跟进确认问题，记录责任人与整改结果')+table(['整改问题','原工单','责任人','处理状态','整改措施','操作'],S.rectifications.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.ticket)}</td><td>${esc(r.owner)}</td><td>${tag(r.status)}</td><td>${esc(r.result||'待补充')}</td><td>${link('查看与处理','rectify-edit',r.id)}</td></tr>`))}

function renderReports(){const jobs=reportJobs(),done=jobs.filter(j=>j.processed),issues=done.flatMap(j=>j.issues),confirmed=issues.filter(i=>i.decision==='确认问题'),rects=S.rectifications.filter(r=>jobs.some(j=>j.ticket===r.ticket));const types=['服务态度','答复准确性','处理规范','工单质量'];return pageHead('统计与报告','汇总质检覆盖、确认问题与整改情况',btn(icon('download')+'导出统计报告','report-export'),'AI 质检 / 质检统计')+`<div class="toolbar"><select aria-label="统计时间" data-filter="reportTime"><option value="all" ${U.reportTime==='all'?'selected':''}>全部演示时间</option><option value="2026-10-01" ${U.reportTime==='2026-10-01'?'selected':''}>2026 年 10 月 1 日</option><option value="2026-09" ${U.reportTime==='2026-09'?'selected':''}>2026 年 9 月</option></select><select aria-label="统计部门" data-filter="reportDept">${['全部部门','IT 服务组','财务服务组','行政服务组','人事服务组'].map(d=>`<option ${U.reportDept===d?'selected':''}>${d}</option>`).join('')}</select><span class="muted small">基于当前原型内工单实时计算</span></div>`+stats([['质检覆盖率',jobs.length?Math.round(done.length/jobs.length*100)+'%':'—',`${done.length} / ${jobs.length} 份工单已完成检查`],['确认问题',confirmed.length,'已完成人工复核的问题'],['待复核问题',issues.filter(i=>i.decision==='待复核').length,'不计入最终确认问题'],['整改完成率',rects.length?Math.round(rects.filter(r=>r.status==='已关闭').length/rects.length*100)+'%':'—',`${rects.filter(r=>r.status==='已关闭').length} / ${rects.length} 项整改已关闭`]])+`<div class="grid two"><section class="panel"><div class="panel-head"><h3>确认问题类型分布</h3><span class="small muted">按问题数统计</span></div><div class="panel-body">${types.map(t=>{const n=confirmed.filter(i=>i.type===t).length;return `<div class="bar-row"><span>${t}</span><div class="bar-track"><div class="bar-fill" style="width:${confirmed.length?n/confirmed.length*100:0}%"></div></div><span class="num">${n}</span></div>`}).join('')}${confirmed.length===0?'<p class="small muted">完成人工复核后显示确认问题分布。</p>':''}</div></section><section class="panel" style="margin:0"><div class="panel-head"><h3>业务组质检完成量</h3><span class="small muted">已检工单数</span></div><div clas async function handleFiles(files){if(files.length>20){toast('单次最多上传 20 个文件，请分批操作。');return}const kb=$('#f-uploadKb')?.value||(U.kb==='all'?'it':U.kb);const messages=[];for(const file of files){const ext=file.name.split('.').pop().toUpperCase();if(file.size>50*1024*1024){messages.push([file.name,'文件超过 50 MB','red']);continue}const allowed=U.uploadMode==='qa'?['CSV','XLSX']:['PDF','DOCX','TXT','MD','JPG','JPEG','PNG'];if(!allowed.includes(ext)){messages.push([file.name,'不支持该格式','red']);continue}if(U.uploadMode==='qa'){const text=ext==='CSV'?await file.text():'';const rows=ext==='CSV'?parseCSV(text):[['Q','相似Q','A','来源依据'],['在哪里查询假期余额？','查询剩余年假','请进入员工服务页查询本人可用假期余额。','员工休假管理办法']];U.qaImportRows=rows;U.qaImportKb=kb;showQAImport(ext==='XLSX');return}const buf=await file.arrayBuffer();let hash='';if(globalThis.crypto?.subtle)hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(v=>v.toString(16).padStart(2,'0')).join('');else hash='size:'+file.size+':'+Array.from(new Uint8Array(buf).slice(0,5000)).join(',');if(S.docs.some(d=>d.hash===hash&&d.kb===kb)){messages.push([file.name,'内容重复，已跳过','orange']);continue}const sameName=S.docs.find(d=>d.name===file.name&&d.kb===kb);const plain=['TXT','MD'].includes(ext);const text=plain?await file.text():'';const d={id:newId('d'),name:file.name,type:ext,size:(file.size/1024).toFixed(1)+' KB',kb,source:'本地上传',folder:'未分类',owner:'赵艺',date:now(),parse:plain?'解析完成':'待处理',proof:'待校对',status:'未发布',scope:S.kbs.find(k=>k.id===kb).scope,expiry:'2027-09-30',version:'V1.0',text,chunks:[],elements:[],table:[],hash,uploaded:true,mime:file.type,preview:URL.createObjectURL(file)};if(sameName){d.revisionOf=sameName.id;d.name=file.name.replace(/(\.[^.]+)$/,'_修订$1');messages.push([file.name,'同名内容不同，作为修订资料接入，原发布内容保留','orange'])}else messages.push([file.name,plain?'已接入，待校对':'已接入，待处理','green']);S.docs.unshift(d);fileCache.set(d.id,file);U.uploadedNames.push(d.id);if(U.uploadMode==='extract'){U.extractDoc=d.id;save();showExtractQA(d.id);return}}

function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}

(r.site)} · ${r.capacity}人 · ${esc(r.equipment)}</div></div>${btn('选择','room-select',r.id,'small soft')}</div>`).join('')}<p class="file-meta">已校验空闲状态、容量、设备和当前员工预订权限</p></div>`;if(c.type==='room-booked')return `<div class="msg-card"><div class="row between"><h3>会议室预订成功</h3>${tag('已预订','green')}</div><dl class="kv"><dt>预订编号</dt><dd>${esc(c.booking.id)}</dd><dt>会议室</dt><dd>${esc(c.booking.roomName)}</dd><dt>时间</dt><dd>${esc(c.booking.date)} ${esc(c.booking.start)}—${esc(c.booking.end)}</dd><dt>会议主题</dt><dd>${esc(c.booking.title)}</dd></dl></div>`;if(c.type==='vpn')return `<div class="msg-card"><div class="row between"><h3>VPN 复杂故障排查</h3>${tag('Agent 自主规划','blue')}</div><p class="small muted">Agent 每轮先制定完整计划，一次执行知识检索和状态检查，再根据整体结果反思。最多执行 3 轮，不会自动转人工。</p>${btn('启动自主排障','vpn-agent-start','','primary small')}</div>`;if(c.type==='vpn-plan')return `<div class="plan-card"><div class="row between"><h3>第 ${c.round} 轮排障</h3>${tag(c.round<3?'已完成并反思':'最后一轮','blue')}</div><ol class="plan-list"><li><b>知识检索：</b>检索 VPN 连接异常的有效排障片段。</li><li><b>批量检查：</b>查询 VPN 服务、账号权限和本人连接记录。</li><li><b>执行结果：</b>${esc(c.result)}</li><li><b>整体反思：</b>${esc(c.reflection)}</li></ol><div class="row wrap">${btn('问题已恢复','employee-resolved','','small soft')}${btn(c.round<3?'仍未解决，重新规划':'仍未解决','vpn-agent-next','','small')}</div></div>`;if(c.type==='vpn-stop')return `<div class="msg-card"><div class="row between"><h3>自动排查已停止</h3>${tag('已完成 3 轮','orange')}</div><p class="small muted">现有知识与自动检查仍不足以确认原因。Agent 不会自动转人工，你可以继续补充信息或自行选择人工服务。</p>${btn('由我转人工','employee-transfer','','primary small')}</div>`;if(c.type==='transfer')return `<div class="msg-card"><div class="row between"><h3>已转入人工服务</h3>${tag('待接入')}</div><p class="small muted">工单 ${esc(c.ticket)} 已保留已有问题信息与排查记录。</p>${btn('查看工单','employee-ticket',c.thread,'small')}${btn('前往客服工作台查看','support-from-ticket',c.thread,'small soft')}</div>`;if(c.type==='docs')return `<div class="msg-card"><h3>可用资料</h3>${S.docs.filter(d=>d.status==='已发布'&&d.scope==='全体员工').map(d=>`<div function renderEmployeeChat(){const msgs=S.employeeTransferred?S.threads.find(t=>t.id===S.employeeTransferred)?.messages||S.employeeSession:S.employeeSession,a=currentAssistant(),c=ASSISTANT_CONTENT[U.assistant]||ASSISTANT_CONTENT.admin;return pageHead(esc(a.name),'已使用企业身份登录',btn(icon('plus')+'新建会话','new-chat'))+`<div class="status-strip"><span>${icon(a.icon)} 当前助手：<b>${esc(a.name)}</b></span>${link('切换助手','nav','employeehome')}</div><div class="chat-layout"><section class="chat-panel"><div class="chat-top"><div class="row"><div class="avatar">AI</div><div><h3>${S.employeeTransferred?'人工服务会话':esc(a.name)}</h3><span class="file-meta">${S.employeeTransferred?'保留自助与人工处理记录':esc(a.desc)}</span></div></div>${btn('转人工','employee-transfer','','small')}</div><div class="messages">${msgs.length?msgs.map((m,i)=>renderMessage(m,true,i)).join(''):`<div class="msg"><div class="avatar">AI</div><div class="msg-content"><div class="bubble">你好，我是${esc(a.name)}。请描述你需要咨询、查询或办理的事项。</div></div></div>`}${U.employeeTyping?'<div class="msg"><div class="avatar">AI</div><div class="bubble">正在整理回复…</div></div>':''}</div><div class="composer"><div class="suggestion-chips">${c.questions.slice(0,3).map(t=>`<button class="chip" data-act="quick-ask" data-id="${esc(t)}">${esc(t)}</button>`).join('')}</div>${U.shot?`<div class="row"><img class="shot-preview" src="${esc(U.shot)}" alt="待发送截图">${link('删除截图','remove-shot')}</div>`:''}<textarea id="employee-input" placeholder="请输入问题，Enter 发送，Shift + Enter 换行" aria-label="员工消息"></textarea><div class="compose-tools"><div class="row">${link(icon('image')+' 上传截图','upload-shot')}${link('结束并评价','employee-evaluate')}</div><div class="row">${U.employeeTyping?btn('停止生成','stop-generation','','small'):''}${btn(icon('send')+'发送','employee-send','','primary small')}</div></div></div></section><div class="chat-aside"><section class="panel"><div class="panel-head"><h3>服务信息</h3></div><div class="panel-body"><dl class="kv" style="grid-template-columns:65px 1fr"><dt>员工</dt><dd>张晨</dd><dt>助手</dt><dd>${esc(a.name)}</dd><dt>会话状态</dt><dd>${S.employeeTransferred?'人工处理中':'自助服务中'}</dd><dt>解决状态</dt><dd>${S.resolved===true?'已确认解决':S.resolved===false?'尚未解决':'待确认'}</dd></dl></div></section><section class="panel"><div class="panel-head"><h3>处理结果</h3></div><div class="panel-body"><p class="muted small" style="margin-bottom:12px">本次问题是否已解决？</p><div class="row">${btn('已解决','employee-resolved','','small soft')}${btn('未解决','employee-unresolved','','small')}</div></div></section></div></div>`}
function employeeReply(text){let m={role:'assistant',text:''};if(/转人工|人工客服|找客服/.test(text)){employeeTransfer();return}if(/会议室/.test(text)&&/预订|预约|订|找|查询|有没有|空闲/.test(text)){m.text='可以通过会议室预订 Skill 完成查询、选择、确认和预订。';m.card={type:'room-skill'}}else if(/余额|几天年假|剩余假/.test(text)){m.text='已查询本人可用假期余额。';m.card={type:'balance',time:now()}}else if(/报销.*(进度|状态)|查询.*报销|查看报销/.test(text)){m.text='找到以下本人报销记录，请选择需要查看的单据。';m.card={type:'expenses',time:now()}}else if(/请假|休假/.test(text)&&/申请|我要|帮我|办理/.test(text)&&!/流程|怎么|如何/.test(text)){m.text='请补充休假信息，确认后提交审批。';m.card={type:'apply',name:'请假申请'}}else if(/申领|申请.*显示器|办公设备/.test(text)){m.text='可以帮助整理设备申领申请。请选择设备并补充用途和领取地点。';m.card={type:'apply',name:'办公设备申领'}}else if(/VPN|vpn/.test(text)&&/断开|失败|连不上|异常|排查|证书/.test(text)){m.text='该问题需要结合知识、服务状态与个人连接记录进行多轮判断。';m.source='q1';m.card={type:'vpn'}}else if(/查找|资料|手册|制度文件/.test(text)){m.text='以下是你有权访问的已发布资料。';m.card={type:'docs'}}else{const query=text.replace(/[？?，,。]/g,''),active=S.qas.filter(q=>q.status==='已发布'&&q.expiry>='2026-10-01'&&['全体员工','产品设计部'].includes(q.scope));const q=active.find(q=>[q.q,...q.similar.split(/[；;\n]/)].some(x=>x&&query.includes(x.replace(/[？?，,。]/g,''))))||active.find(q=>/请假|休假|制度/.test(text)&&q.category==='人事'||/报销/.test(text)&&q.category==='财务'||/账号|权限/.test(text)&&/权限/.test(q.q));if(q){m.text=q.a;m.source=q.id}else m.text='当前还不能确认对应的处理方案。请补充具体业务、操作环节或报错信息，也可以直接转人工。'}S.employeeSession.push(m)}
function runInspection(id){const j=S.inspections.find(j=>j.id===id);if(!S.rules.some(r=>r.enabled))return toast('请先启用至少一条质检规则。');j.status='质检中';save();render();setTimeout(()=>{j.processed=true;j.issues=[];const check=S.rules.find(r=>r.id==='r4');if(check?.enabled&&(!j.solution.trim()||!j.result.trim()))j.issues.push({id:newId('i'),type:'工单质量',rule:check.name,text:'缺少最终方案或处理结果',evidence:'工单对应字段为空。',decision:'待复核',comment:''});j.status=j.issues.length?'待复核':'未发现问题';j.date='2026-10-01';j.ruleSnapshot=S.rules.filter(r=>r.enabled).map(r=>r.name);save();render();toast('演示质检已完成，可查看结果。')},600)}

 'room-submit':()=>{const d=U.roomDraft;if(!d?.roomId)return toast('请先选择会议室。');if(d.submitted)return toast('该预订已提交，请勿重复操作。');d.submitted=true;const booking={...d,id:'MR-'+Date.now().toString().slice(-8)};S.bookings.push(booking);S.employeeSession.push({role:'assistant',text:'会议室已预订，以下为本次预订结果。',card:{type:'room-booked',booking}});save();closeModal();go('employeechat')},
 'vpn-agent-start':()=>{U.vpnRound=1;S.employeeSession.push({role:'assistant',text:'已完成第 1 轮整体计划执行。',card:{type:'vpn-plan',round:1,result:'已检索 VPN 排障知识；服务状态正常；账号未锁定；连接记录显示证书校验失败。',reflection:'已排除公共服务故障和账号锁定，下一轮需要核对客户端证书与配置。'}});save();render()},

 'application-preview':()=>{const d=formData();if(!d)return;if(U.applyType==='请假申请'&&d.end<=d.start)return toast('结束时间应晚于开始时间。');if(U.applyType!=='请假申请'&&(!Number.isInteger(+d.quantity)||+d.quantity<=0))return toast('设备数量需为正整数。');U.applicationDraft={...d,type:U.applyType};U.applicationSubmitted=false;modal('确认申请信息',`<dl class="kv"><dt>申请人</dt><dd>${U.applyActor==='support'?esc(S.threads.find(t=>t.id===U.thread).employee):'张晨'}</dd><dt>申请类型</dt><dd>${esc(U.applyType)}</dd>${Object.entries(d).filter(([k])=>k!=='authorized').map(([k,v])=>`<dt>${{item:'申请事项',quantity:'数量',location:'领取地点',reason:'申请事由',start:'开始时间',end:'结束时间'}[k]||k}</dt><dd>${esc(v)}</dd>`).join('')}<dt>审批流程</dt><dd>直属主管审批后按业务规则继续处理</dd></dl><div class="note spaced">确认后提交申请。申请提交成功与审批通过分别记录。</div>`,btn('返回修改','application-back')+btn('确认提交','application-submit','','primary'))},

 'application-submit':()=>{if(U.applicationSubmitted)return toast('该申请已提交，请查看办理结果。');U.applicationSubmitted=true;const d=U.applicationDraft;const id=(d.type==='请假申请'?'QJ':'ZC')+'-20261001-'+String(S.applications.length+1).padStart(3,'0');const a={...d,id,title:d.item,date:'2026-10-01',status:'审批中',node:'直属主管审批',source:d.type==='请假申请'?'人力资源系统':'办公资产系统',employee:U.applyActor==='support'?S.threads.find(t=>t.id===U.thread).employee:'张晨'};S.applications.push(a);if(U.applyActor==='support'){const t=S.threads.find(t=>t.id===U.thread);t.messages.push({role:'internal',text:'已按员工授权提交 '+d.type+'，编号 '+id+'，当前等待主管审批。'});t.businessResult='已提交 '+id+'，等待主管审批';t.businessSource=a.source;t.businessTime=now()}else S.employeeSession.push({role:'assistant',text:'申请已提交，当前等待主管审批。',card:{type:'application',id}});save();closeModal();if(U.applyActor==='support')render();else go('employeechat');toast('申请已提交，当前处于审批中。')},

 'support-ticket':id=>{U.thread=id;U.assist='ticket';go('support')},
 'resolve-ticket':id=>resolveForm(id),
 'resolve-confirm':id=>{const d=formData();if(!d)return;if(d.confirmedBy==='请选择')return toast('请选择处理结果确认依据。');if(/待补充|待确认/.test(d.result))return toast('处理结果尚未确认，请继续跟进后再结单。');const t=S.threads.find(t=>t.id===id);t.fields.原因=d.cause;t.solution=d.solution;t.result=d.result;t.status='已解决';t.messages.push({role:'system',text:'工单已解决：'+d.result});if(!S.inspections.some(j=>j.ticket===t.ticket))S.inspections.unshift({id:newId('j'),ticket:t.ticket,title:t.title,agent:t.owner,dept:t.fields.分类.split(' / ')[0]+' 服务组',date:'2026-10-01',status:'待质检',processed:false,issues:[],transcript:t.messages.filter(m=>m.role!=='internal').map(m=>m.role+': '+m.text).join('\n'),solution:t.solution,result:t.result});save();closeModal();U.assist='knowledge';render();toast('工单已结单，可提交案例，已自动触发质检。');const pending=S.inspections.find(j=>j.ticket===t.ticket&&!j.processed);if(pending)setTimeout(()=>runInspection(pending.id),250)},
 'case-draft':id=>caseDraft(id),
 'case-submit':id=>{const d=formData();if(!d)return;const t=S.threads.find(t=>t.id===id);if(S.cases.some(c=>c.ticket===t.ticket&&c.status==='待审核'))return toast('该工单已有待审核案例，请勿重复提交。');S.cases.unshift({...d,id:newId('c'),ticket:t.ticket,employee:'已脱敏员工',submitter:'陈宁',category:t.fields.分类.split(' / ')[0],date:now(),status:'待审核',comment:'',evidence:t.messages.filter(m=>m.role!=='internal').map(m=>(m.role==='user'?'员工':'客服')+'：'+m.text).join('\n')});log('客服提交工单知识：'+t.ticket);closeModal();render();toast('已提交知识平台审核，可切换到工单知识审核查看。')},
 'submitted-detail':id=>{const c=S.cases.find(c=>c.id===id);modal('案例提交详情',`<h3>${esc(c.title)}</h3><div class="row spaced">${tag(c.status)}<span class="small muted">${esc(c.ticket)}</span></div><div class="evidence"><b>Q：</b>${esc(c.q)}<br><b>A：</b>${esc(c.a)}</div><p>审核意见：${esc(c.comment||'暂无')}</p>${c.status==='已退回'?`<form id="modal-form" class="spaced">${area('q','补充问题',c.q,true)}${area('a','补充答案',c.a,true)}${area('extra','补充依据','',true)}</form>`:''}`,btn('关闭','close')+(c.status==='已退回'?btn('重新提交','case-resubmit',id,'primary'):''))},
 'case-resubmit':id=>{const v=formData();if(!v)return;const c=S.cases.find(c=>c.id===id);c.q=v.q;c.a=v.a;c.evidence+='\n客服补充：'+v.extra;c.status='待审核';save();closeModal();render()},
 'feedback-new':id=>{U.feedbackThread=id;modal('登记知识问题',`<form id="modal-form">${select('type','问题类型',['知识缺失','内容错误','信息过期','不适用'])}${input('knowledge','关联知识（可选）','')}${area('text','问题说明与修正建议','',true)}</form>`,btn('取消','close')+btn('提交反馈','feedback-create',id,'primary'))},
 'feedback-create':id=>{const d=formData();if(!d)return;S.feedback.unshift({id:newId('f'),text:d.type+'：'+d.text,knowledge:d.knowledge,ticket:S.threads.find(t=>t.id===id)?.ticket||'',source:'客服知识反馈',status:'待处理'});save();closeModal();toast('已提交知识平台跟进。')},
 'feedback-handle':id=>{const f=S.feedback.find(f=>f.id===id);modal('知识反馈处理',`<p>${esc(f.text)}</p><div class="file-meta">${esc(f.source)} · ${esc(f.ticket||f.knowledge||'')}</div><form id="modal-form" class="spaced">${select('status','处理状态',['待处理','处理中','已处理'],f.status)}${area('result','处理说明',f.result||'',true)}</form>`,btn('取消','close')+btn('保存处理结果','feedback-save',id,'primary'))},
 'feedback-save':id=>{const v=formData();if(!v)return;Object.assign(S.feedback.find(f=>f.id===id),v);save();closeModal();render()},
 'rule-new':()=>ruleForm(), 'rule-edit':id=>ruleForm(id),
 'rule-save':id=>{const d=formData();if(!d)return;const r=S.rules.find(r=>r.id===id);if(r)Object.assign(r,d);else S.rules.push({...d,id:newId('r'),enabled:true});log('保存质检规则：'+d.name);closeModal();render()},
 'rule-toggle':id=>{const r=S.rules.find(r=>r.id===id);r.enabled=!r.enabled;save();render()},
 'open-review':id=>go('review',id), 'run-inspection':id=>runInspection(id),
 'inspect-select':()=>modal('发起质检',`<p class="small muted">选择已完成服务且尚未完成质检的工单。</p><div class="spaced">${S.inspections.filter(j=>!j.processed).map(j=>`<label class="check-line"><input type="checkbox" name="inspectjob" value="${j.id}" checked>${esc(j.ticket)} · ${esc(j.title)}</label>`).join('')||empty('当前应检任务均已完成')}</div>`,btn('取消','close')+btn('开始质检','inspect-start','','primary')),
 'inspect-start':()=>{const ids=$$('input[name=inspectjob]:checked').map(x=>x.value);if(!ids.length)return toast('请选择至少一份工单。');closeModal();ids.forEach(runInspection)},
 'issue-confirm':id=>issueDecision(id,'确认问题'), 'issue-dismiss':id=>issueDecision(id,'误判'),
 'issue-edit':id=>{const {i}=findIssue(id);modal('修改质检结论',`<form id="modal-form">${area('text','问题描述',i.text,true)}${area('comment','修改依据',i.comment,true)}</form>`,btn('取消','close')+btn('保存','issue-edit-save',id,'primary'))},
 'issue-edit-save':id=>{const d=formData();if(!d)return;const {i}=findIssue(id);i.text=d.text;i.comment=d.comment;save();closeModal();render()},
 'rectify-new':id=>{const {j,i}=findIssue(id);if(S.rectifications.some(r=>r.issue===id&&r.status!=='已关闭'))return toast('该问题已有未关闭的整改任务。');modal('发起整改',`<p>${esc(i.text)}</p><form id="modal-form" class="spaced"><div class="form-grid">${input('owner','责任人',j.agent,'text',true)}${input('due','要求完成日期','2026-10-08','date',true)}${area('requirement','整改要求','',true)}</div></form>`,btn('取消','close')+btn('分派整改','rectify-create',id,'primary'))},
 'rectify-create':id=>{const v=formData();if(!v)return;const {j,i}=findIssue(id);S.rectifications.unshift({...v,id:newId('rect'),issue:id,title:i.text,ticket:j.ticket,status:'待处理',result:''});save();closeModal();toast('整改任务已分派，可在问题整改中跟进。')},
 'rectify-edit':id=>{const r=S.rectifications.find(r=>r.id===id);modal('整改处理',`<dl class="kv"><dt>整改问题</dt><dd>${esc(r.title)}</dd><dt>责任人</dt><dd>${esc(r.owner)}</dd><dt>整改要求</dt><dd>${esc(r.requirement)}</dd><dt>当前状态</dt><dd>${tag(r.status)}</dd></dl><form id="modal-form" class="spaced">${area('result','整改措施与处理结果',r.result,true)}</form>`,btn('取消','close')+btn('提交整改结果','rectify-save',id)+(r.status==='待验收'?btn('确认关闭','rectify-close',id,'primary'):''))},
 'rectify-save':id=>{const d=formData();if(!d)return;const r=S.rectifications.find(r=>r.id===id);r.result=d.result;r.status='待验收';save();closeModal();render();toast('整改结果已提交，等待质检人员验收。')},
 'rectify-close':id=>{const d=formData();if(!d)return;const r=S.rectifications.find(r=>r.id===id);r.result=d.result;r.status='已关闭';save();closeModal();render();toast('整改已验收关闭。')},
 'qc-feedback':id=>{const {j,i}=findIssue(id);if(S.feedback.some(f=>f.issue===id))return toast('该问题已反馈至知识运营。');S.feedback.unshift({id:newId('f'),issue:id,text:i.text,ticket:j.ticket,source:'质检复核反馈',status:'待处理'});save();toast('已提交至知识反馈列表。')},
 'report-export':()=>{const jobs=reportJobs();csvExport('AI质检统计报告.csv',[['统计范围',U.reportTime,U.reportDept],['应检工单',jobs.length],['已完成质检',jobs.filter(j=>j.processed).length],['工单编号','主题','客服','业务组','质检状态','AI问题数','人工确认数'],...jobs.map(j=>[j.ticket,j.title,j.agent,j.dept,j.status,j.issues.length,j.issues.filter(i=>i.decision==='确认问题').length])]);toast('报告已导出为 CSV，可用 Excel 打开。')}
};
function showTableEditor(){modal('OCR 表格修正',`<p class="small muted">通过增删行列修复漏行、错列；点击单元格修改内容，确认后应用。</p><div class="row wrap spaced">${btn('增加行','table-add-row','','small')}${btn('增加列','table-add-col','','small')}${btn('删除末行','table-delete-row','','small')}${btn('删除末列','table-delete-col','','small')}${btn('删除错误表格','table-clear','','small danger')}</div><div class="table-wrap spaced"><table>${U.tableEdit.map((r,i)=>`<tr>${r.map((c,j)=>`<td style="padding:6px"><input data-tablecell="${i}:${j}" aria-label="第${i+1}行第${j+1}列" value="${esc(c)}"></td>`).join('')}</tr>`).join('')}</table></div>`,btn('取消','close')+btn('应用修改','table-apply','','primary'),true)}
function captureTable(){$$('[data-tablecell]').forEach(x=>{const [i,j]=x.dataset.tablecell.split(':');U.tableEdit[i][j]=x.value})}
function caseDecision(id,status){const c=S.cases.find(c=>c.id===id);setCaseValues(c);U.caseDecision=status;modal(status==='已退回'?'退回客服补充':'不采纳案例',`<form id="modal-form">${area('reason','处理原因','',true)}</form>`,btn('取消','close')+btn('确认','case-decision-confirm',id,'primary'))}
function issueDecision(id,type){const {j,i}=findIssue(id);const input=$('#review-'+id),comment=input?.value.trim()||'';if(!comment)return toast('请填写复核依据或说明。');i.decision=type;i.comment=comment;j.status=j.issues.every(i=>i.decision!=='待复核')?'已复核':'待复核';save();render();toast(type==='确认问题'?'问题已人工确认，可继续分派整改。':'已标记误判，不计入确认问题。')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id||'';if(actions[a]){try{await actions[a](id,b)}catch(err){console.error(a,err);toast('本次操作未完成，请检查输入后重试。')}}});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.target.id==='employee-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();actions['employee-send']()}if(e.target.id==='home-query'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();actions['home-send']()}if(e.target.matches('[role=button][data-act]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});
let filterTimer;document.addEventListener('input',e=>{if(e.target.id==='support-input')U.drafts[U.thread]=e.target.value;if(e.target.dataset.filter&&e.target.tagName==='INPUT'){const k=e.target.dataset.filter,v=e.target.value;clearTimeout(filterTimer);filterTimer=setTimeout(()=>{U[k]=v;const pos=e.target.selectionStart;render();const n=$(`[data-filter="${k}"]`);n?.focus();try{n?.setSelectionRange(pos,pos)}catch(err){}},180)}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){U[e.target.dataset.filter]=e.target.value;render()}if(e.target.dataset.change==='seat-status'){S.seatStatus=e.target.value;save();toast('已切换接待状态，已有工单仍会保留。')}if(e.target.dataset.change==='template'){captureSupport();const t=S.threads.find(t=>t.id===U.thread);t.template=e.target.value;save();render();toast('模板已切换，原已填写信息保留，请核对字段。')}});
async function handleFilesEnhanced(files){const pptx=files.filter(f=>f.name.toLowerCase().endsWith('.pptx')),others=files.filter(f=>!f.name.toLowerCase().endsWith('.pptx'));if(others.length)await handleFiles(others);if(!pptx.length)return;const kb=$('#f-uploadKb')?.value||(U.kb==='all'?'it':U.kb),messages=[];for(const file of pptx){if(file.size>50*1024*1024){messages.push([file.name,'文件超过 50 MB','red']);continue}const d={id:newId('d'),name:file.name,type:'PPTX',size:(file.size/1024).toFixed(1)+' KB',kb,source:'本地上传',folder:'未分类',owner:'赵艺',date:now(),parse:'待处理',proof:'待校对',status:'未发布',scope:S.kbs.find(k=>k.id===kb)?.scope||'全体员工',expiry:'2027-09-30',version:'V1.0',text:'',chunks:[],elements:[],table:[],hash:'pptx:'+file.name+':'+file.size,uploaded:true,mime:file.type,preview:URL.createObjectURL(file)};if(S.docs.some(x=>x.hash===d.hash&&x.kb===kb)){messages.push([file.name,'文件重复，已跳过','orange']);continue}S.docs.unshift(d);fileCache.set(d.id,file);U.uploadedNames.push(d.id);messages.push([file.name,'已接入，待转换解析','green'])}save();const box=$('#upload-results');if(box)box.innerHTML+=messages.map(([n,t,c])=>`<div class="row between evidence"><span>${esc(n)}</span>${tag(t,c)}</div>`).join('')}
$('#file-input').addEventListener('change',e=>handleFilesEnhanced([...e.target.files]));
$('#shot-input').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>5*1024*1024)return toast('请选择不超过 5 MB 的图片。');const r=new FileReader();r.onload=()=>{if(U.shotTarget==='support'){S.threads.find(t=>t.id===U.thread).messages.push({role:U.composeMode==='note'?'internal':'agent',text:'已上传图片',image:r.result});save()}else U.shot=r.result;render()};r.readAsDataURL(f)});
document.addEventListener('dragover',e=>{if(e.target.closest('.dropzone'))e.preventDefault()});document.addEventListener('drop',e=>{if(e.target.closest('.dropzone')){e.preventDefault();handleFilesEnhanced([...e.dataTransfer.files])}});
document.addEventListener('pointerdown',e=>{const zone=e.target.closest('#crop-zone');if(!zone)return;const rect=zone.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;U.cropBox={x,y,w:0,h:0};zone.setPointerCapture(e.pointerId);const box=$('#crop-box');box.style.display='block';box.style.left=x+'px';box.style.top=y+'px';box.style.width='0';box.style.height='0';zone.onpointermove=ev=>{const x2=ev.clientX-rect.left,y2=ev.clientY-rect.top;U.cropBox.w=Math.abs(x2-x);U.cropBox.h=Math.abs(y2-y);box.style.left=Math.min(x,x2)+'px';box.style.top=Math.min(y,y2)+'px';box.style.width=U.cropBox.w+'px';box.style.height=U.cropBox.h+'px'};zone.onpointerup=()=>{zone.onpointermove=null;if(U.cropBox.w<5||U.cropBox.h<5)U.cropBox=null}});
window.addEventListener('beforeunload',()=>{captureSupport();if(U.view==='editor')captureEditor();save()});
render();
</script>
</body></html>
